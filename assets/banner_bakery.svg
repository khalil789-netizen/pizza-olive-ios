<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="0.48" stop-color="#0f1738"/>
      <stop offset="1" stop-color="#060914"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="25%" r="75%">
      <stop offset="0" stop-color="rgba(200,120,255,0.48)"/>
      <stop offset="1" stop-color="rgba(200,120,255,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="75%" r="80%">
      <stop offset="0" stop-color="rgba(215,178,90,0.26)"/>
      <stop offset="1" stop-color="rgba(215,178,90,0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>
  </defs>
  <rect width="1400" height="700" fill="url(#bg)"/>
  <rect width="1400" height="700" fill="url(#glow)"/>
  <rect width="1400" height="700" fill="url(#glow2)"/>
  <g filter="url(#soft)" opacity="0.9">
