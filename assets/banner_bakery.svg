  </g>
  <g opacity="0.9">
    <text x="120" y="280" font-family="Arial, sans-serif" font-size="122" font-weight="900" fill="rgba(233,238,252,0.96)">🥙</text>
    <text x="120" y="385" font-family="Arial, sans-serif" font-size="76" font-weight="900" fill="rgba(233,238,252,0.92)">BAKERY</text>
    <text x="120" y="452" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="rgba(168,179,214,0.92)">Young • Trendy • WOW</text>
