<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Pizza Olive - טעינת תפריט ל-Firebase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background:#020617;
      color:#e5e7eb;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      padding:20px;
      direction:rtl;
      text-align:right;
    }
    .card {
      max-width:600px;
      margin:40px auto;
      background:#020617;
      border-radius:16px;
      border:1px solid #1f2933;
      padding:20px;
      box-shadow:0 18px 45px rgba(0,0,0,0.6);
    }
    h1 {margin-top:0;font-size:1.4rem;}
    button {
      border-radius:999px;
      border:1px solid #22c55e;
      background:#16a34a;
      color:#041308;
      padding:8px 18px;
      font-size:0.9rem;
      cursor:pointer;
      font-weight:600;
    }
    button:disabled {
      opacity:0.6;
      cursor:default;
    }
    .log {
      margin-top:15px;
      font-size:0.85rem;
      max-height:260px;
      overflow-y:auto;
      background:#020617;
      border-radius:8px;
      border:1px solid #1f2933;
      padding:8px;
      white-space:pre-wrap;
    }
    .ok {color:#4ade80;}
    .err {color:#f97373;}
  </style>
</head>
<body>
  <div class="card">
    <h1>טעינת תפריט ברירת מחדל ל-Firebase</h1>
    <p>דף זה מריץ פעם אחת טעינה של כל התפריט למאגר <code>menu</code> בפרויקט: <strong>olive-kopa</strong>.</p>
    <ol>
      <li>תוודא שהקובץ <code>firebase-config.js</code> מכיל את ההגדרות שלך (כבר הכנסנו עבורך).</li>
      <li>תלחץ על הכפתור למטה.</li>
      <li>אחרי שמופיע הודעת סיום, תוכל לסגור את הדף ולהשתמש בקופה הרגילה.</li>
    </ol>
    <button id="runBtn">🚀 הרץ טעינת תפריט</button>
    <div id="status" style="margin-top:10px;font-size:0.9rem;"></div>
    <div id="log" class="log"></div>
  </div>

  <script type="module" src="./js/seed-menu.js"></script>
</body>
</html>
