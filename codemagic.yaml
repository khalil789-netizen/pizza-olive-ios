workflows:
  ios_release:
    name: iOS Release (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.pizzaolive.app"

    scripts:
      - name: Install NPM deps
        script: |
          npm ci || npm i

      - name: Build web (optional)
        script: |
          npm run build || echo "no build step"

      - name: Capacitor sync iOS (creates Podfile)
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Xcode Archive (unsigned)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive

    artifacts:
      - ios/App/build/**/*.xcarchive
