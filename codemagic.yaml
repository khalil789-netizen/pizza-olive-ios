workflows:
ios_release:
name: Pizza Olive iOS Build
instance_type: mac_mini_m2
max_build_duration: 60

```
environment:
  node: latest
  xcode: latest

scripts:
  - name: Install dependencies
    script: |
      npm install

  - name: Build web assets
    script: |
      if [ -d "www" ]; then
        echo "www exists"
      else
        echo "ERROR: www folder missing"
        exit 1
      fi

  - name: Sync Capacitor
    script: |
      npx cap sync ios

  - name: Build iOS (SPM — no CocoaPods)
    script: |
      cd ios/App
      xcodebuild \
        -project App.xcodeproj \
        -scheme App \
        -configuration Release \
        -sdk iphoneos \
        -archivePath build/App.xcarchive \
        archive

artifacts:
  - ios/App/build/*.xcarchive
```
