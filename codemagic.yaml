workflows:
  ios_release:
    name: Pizza Olive iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Ensure web assets exist
        script: |
          if [ ! -d "www" ]; then
            echo "www folder missing, building..."
            npm run build || echo "no build script, continuing"
          fi

      - name: Add iOS platform
        script: |
          npx cap add ios || echo "ios already exists"

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build Xcode archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/App.xcarchive archive

    artifacts:
      - ios/App/build/*.xcarchive
