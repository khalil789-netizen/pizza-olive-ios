workflows:
  ios_release:
    name: Pizza Olive iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest

    scripts:

      - name: Install dependencies
        script: |
          npm install

      - name: Ensure web assets exist
        script: |
          if [ ! -d "www" ]; then
            echo "www folder missing!"
            exit 1
          fi

      - name: Add iOS platform
        script: |
          npx cap add ios || true

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build Xcode archive
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive archive

    artifacts:
      - ios/App/build/**/*.xcarchive
