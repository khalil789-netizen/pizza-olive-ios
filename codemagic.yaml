workflows:
  ios_release:
    name: Pizza Olive iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Ensure web assets exist
        script: |
          mkdir -p www
          cp -r assets www/ || true
          cp -r css www/ || true
          cp -r js www/ || true
          cp index.html www/ || true

      - name: Create iOS platform fresh
        script: |
          npx cap add ios --force

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build iOS archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/App.xcarchive archive

    artifacts:
      - ios/App/build/**/*.xcarchive
