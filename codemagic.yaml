workflows:
  pizza_olive_ios:
    name: Pizza Olive iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest

    scripts:

      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          if [ -d "www" ]; then
            echo "WWW exists"
          else
            echo "ERROR: www folder missing"
            exit 1
          fi

      # מוחק iOS ישן כדי ש-Capacitor יבנה פרויקט Xcode אמיתי
      - name: Recreate iOS project
        script: |
          rm -rf ios
          npx cap add ios

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build IPA
        script: |
          cd ios/App
          xcodebuild \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/App.xcarchive \
          archive

    artifacts:
      - ios/App/build/**/*.xcarchive
